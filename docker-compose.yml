# PaynEat ERP — PostgreSQL 16 and the API, for trying it locally and small self-hosted
# installations. Adapted from Cwork's docker-compose.yml, see NOTICE.
#
#   cp .env.example .env                                # then fill in the three secrets it asks for
#   echo ERP_DEMO=1 >> .env                             # only to evaluate with the demo chain
#   docker compose up -d --build                        # PostgreSQL 16, the API and the console
#   docker compose run --rm --build migrate             # apply database migrations
#   docker compose run --rm migrate npm run db:seed     # the fictional demo chain (needs ERP_DEMO=1)
#   open http://localhost:8180                          # the web console (Thai; English one click away)
#   curl http://localhost:3100/health
#
# The console is published on host port 8180 and the API on 3100 (not 8080/3000) so both
# can run next to PaynEat POS, whose Docker install uses 3000 and 8080. Metrics
# (:9464/metrics) and PostgreSQL are deliberately not published: a scraper or psql reaches
# them inside the network.

name: payneat-erp

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      # Only reachable inside the compose network. Set your own in .env for anything
      # beyond trying it out.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp-local}
      POSTGRES_DB: ${POSTGRES_DB:-payneat_erp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-payneat_erp}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp-local}@postgres:5432/${POSTGRES_DB:-payneat_erp}?schema=public
      # The console reaches the API through its own nginx (same origin, no CORS needed);
      # this allows a console served separately at the default address as well.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8180}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-default}
      METRICS_PORT: 9464
      # 1 only for an evaluation with the demo chain, whose accounts have published
      # passwords (#5). Without it the API refuses their sign-in, and refuses to start at
      # all while one is enabled: `docker compose run --rm migrate npm run demo:disable`.
      ERP_DEMO: ${ERP_DEMO:-0}
      # No defaults, on purpose: a published secret would sign every installation's
      # sessions. Compose refuses to start until .env has them (see .env.example).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env (see .env.example)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (see .env.example)}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env (see .env.example)}
    ports:
      - "${ERP_API_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # The admin console (#3): the built React app behind nginx, which also forwards `/api/`
  # and `/health` to the API, so the browser sees one origin. Built from the repository root:
  # the console's public demo imports the backend's pure rules (ADR-0021), and the typecheck
  # sees them; web/Dockerfile.dockerignore keeps everything else out of the build.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ERP_WEB_PORT:-8180}:80"

  # One-off tools container: migrations and the demo seed. Built from the Dockerfile's
  # `build` stage, which keeps the Prisma CLI the runtime image prunes away. Under a
  # profile so `docker compose up` never starts it; `docker compose run` enables it.
  migrate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp-local}@postgres:5432/${POSTGRES_DB:-payneat_erp}?schema=public
      # The demo seed stores the demo admin's second factor encrypted with the API's key.
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env (see .env.example)}
      # The demo seed refuses to run without it (#5); migrations ignore it.
      ERP_DEMO: ${ERP_DEMO:-0}
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

volumes:
  postgres-data:
