name: CI

# Every gate in CLAUDE.md "Stack", on every push and pull request (#2). Adapted from
# Cwork's CI, see NOTICE.
on:
  push:
  pull_request:

# A new push supersedes an in-flight run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: payneat_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d payneat_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/payneat_erp_test?schema=public
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unset, deliberately: unit tests must pass on a clean clone with no database and
      # no configuration, which this job's env block would otherwise hide. (Cwork learned
      # this the hard way; see its ci.yml.)
      - name: Unit tests, with the environment a fresh clone has
        run: env -u DATABASE_URL -u NODE_ENV npm test

      - name: Architecture check (ADR-0010)
        run: npm run check:architecture

      # Black-box run against the real API and a real PostgreSQL 16: migrates, wipes
      # (only a database named like a test database) and seeds the demo chain first.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://erp:erp@localhost:5432/payneat_erp_test?schema=public
          # On purpose: the suite seeds the demo chain and signs in with it (#5). The specs
          # that test the refusals boot their apps with ERP_DEMO=0 themselves.
          ERP_DEMO: '1'

      - name: Build
        run: npm run build

  web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Includes the catalogue parity check, the scan for hard-coded UI text and axe on
      # every screen in both languages.
      - name: Tests (Vitest, Testing Library, axe)
        run: npm test

      - name: Production build
        run: npm run build

      # The public demo (#41, ADR-0021): a normal build carries none of the in-browser demo
      # API and none of its published credentials, and the demo build carries all of it.
      - name: No demo code in the production build
        run: node scripts/check-demo-build.mjs dist

      - name: Public demo build
        run: npx vite build --outDir dist-demo && node scripts/check-demo-build.mjs --demo dist-demo
        env:
          VITE_ERP_DEMO: '1'
          VITE_BASE_PATH: /PaynEat-ERP/

      # The product page and the README section "The problems it solves today" are generated from
      # docs/landing/content.mjs (#45); this fails when one was edited without the other.
      - name: Product page and README section match their source
        run: node ../docs/landing/build.mjs --check

  compose:
    name: docker compose up
    runs-on: ubuntu-latest

    # Nothing else runs the Dockerfiles or docker-compose.yml, and PaynEat POS once shipped
    # a Dockerfile that could not build for weeks because no job built it (POS
    # DECISIONS #63). This runs exactly what README "Try it" tells a person to run.
    steps:
      - uses: actions/checkout@v4

      # The secrets .env.example asks for, generated the way it suggests, and ERP_DEMO=1 on
      # purpose: this job evaluates the demo chain exactly as README "Try it" does (#5).
      - name: Create .env
        run: |
          printf 'JWT_ACCESS_SECRET=%s\nJWT_REFRESH_SECRET=%s\nFIELD_ENCRYPTION_KEY=%s\n' \
            "$(openssl rand -base64 48)" "$(openssl rand -base64 48)" "$(openssl rand -base64 32)" > .env
          echo 'ERP_DEMO=1' >> .env

      - name: Compose refuses to start without the secrets
        run: |
          if env -i PATH="$PATH" docker compose --env-file /dev/null config > /dev/null 2>&1; then
            echo "docker compose accepted a configuration without JWT secrets"; exit 1
          fi

      - name: Start PostgreSQL 16, the API and the console
        run: docker compose up -d --build --wait

      - name: Apply migrations and build the demo chain
        run: |
          docker compose run --rm --build migrate
          docker compose run --rm migrate npm run db:seed

      - name: The API reports itself and its database as up
        run: |
          body=$(curl -fsS http://localhost:3100/health)
          echo "$body"
          test "$body" = '{"status":"ok","api":"up","database":"up"}'

      - name: Metrics are not published on the host
        run: |
          if curl -fsS --max-time 3 http://localhost:9464/metrics > /dev/null; then
            echo "metrics port is reachable from outside the compose network"; exit 1
          fi
          docker compose exec -T api curl -fsS http://127.0.0.1:9464/metrics > metrics.txt
          grep -q '^http_requests_total' metrics.txt
          grep -q '^auth_sign_in_failures_total{app="payneat-erp-api"} 0' metrics.txt

      - name: The console is served and reaches the API through its own origin
        run: |
          curl -fsS http://localhost:8180/ | grep -q '<div id="root"></div>'
          # Client-side routes survive a reload (SPA fallback).
          curl -fsS http://localhost:8180/some/deep/link | grep -q '<div id="root"></div>'
          body=$(curl -fsS http://localhost:8180/health)
          echo "$body"
          test "$body" = '{"status":"ok","api":"up","database":"up"}'
          curl -fsS -D - -o /dev/null http://localhost:8180/health | grep -qi '^x-request-id:'
          # Security headers on the page itself, not only on the server block (nginx drops
          # inherited add_header in a location that sets its own).
          curl -fsS -D - -o /dev/null http://localhost:8180/ | grep -qi '^content-security-policy:'

      - name: A demo account signs in through the console's origin
        run: |
          curl -fsS -X POST http://localhost:8180/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"purchasing@demo-chicken.example","password":"demo-chicken-2026"}' > session.json
          grep -q '"mfaRequired":false' session.json
          grep -q '"roles":\["purchasing"\]' session.json
          # The admin gets a second-factor challenge, not a session.
          curl -fsS -X POST http://localhost:8180/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@demo-chicken.example","password":"demo-chicken-2026"}' | grep -q '"mfaRequired":true'

      - name: The console is told this is a demo installation
        run: |
          body=$(curl -fsS http://localhost:8180/api/v1/installation)
          echo "$body"
          test "$body" = '{"demo":true}'

      - name: Logs are contract-shaped JSON
        run: |
          docker compose logs --no-log-prefix api | grep '"event":"http.request.completed"' | head -1 | tee line.json
          grep -q '"severity":"INFO"' line.json
          # A production API with ERP_DEMO=1 says so at every start (#5).
          docker compose logs --no-log-prefix api | grep '"severity":"WARNING"' | grep -q 'Demo installation (ERP_DEMO=1)'

      # The product owner's rules for #5, run against the real images.
      - name: Without ERP_DEMO=1, the API refuses to start while demo accounts are enabled
        run: |
          if docker compose run --rm --no-deps -e ERP_DEMO=0 api > refused.log 2>&1; then
            cat refused.log; echo "the API started with enabled demo accounts and no ERP_DEMO=1"; exit 1
          fi
          cat refused.log
          grep '"severity":"CRITICAL"' refused.log | grep -q 'docker compose run --rm migrate npm run demo:disable'

      - name: The documented command disables them, and then it starts
        run: |
          docker compose run --rm migrate npm run demo:disable | tee disabled.log
          grep -q 'Disabled 7 demo accounts' disabled.log
          ERP_DEMO=0 docker compose up -d --wait api
          test "$(curl -fsS http://localhost:3100/api/v1/installation)" = '{"demo":false}'
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3100/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"purchasing@demo-chicken.example","password":"demo-chicken-2026"}')
          test "$status" = 401

      - name: The demo seed refuses to run without ERP_DEMO=1
        run: |
          if docker compose run --rm -e ERP_DEMO=0 migrate npm run db:seed > seed.log 2>&1; then
            cat seed.log; echo "the demo seed ran without ERP_DEMO=1"; exit 1
          fi
          cat seed.log
          grep -q 'ERP_DEMO is not 1' seed.log

      - if: always()
        run: docker compose down -v
