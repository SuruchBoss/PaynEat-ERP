# Included by nginx.conf in the server block AND in every location that sets its own
# add_header: nginx drops all inherited add_header directives in such a location, which
# would otherwise serve index.html and the assets without these. (Cwork's nginx.conf,
# where this layout comes from, has that gap.)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# The console loads nothing from third parties, so the policy stays strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
